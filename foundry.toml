[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
fs_permissions = [{access = "read-write", path = ".forge-snapshots/"}, {access = "read-write", path = "./safe-batches"}, {access = "read-write", path = "./deployments"}]
libs = ["lib"]
out = "out"
solc_version = "0.8.30"
src = "src"
via_ir = false
optimizer = true
optimizer_runs = 1000

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"

[profile.ci]
fuzz = { runs = 2000 }
